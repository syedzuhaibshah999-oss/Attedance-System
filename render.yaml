services:
  - type: web
    name: attendance-saas-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: attendance-saas-db
          property: connectionString

databases:
  - name: attendance-saas-db
    plan: free
